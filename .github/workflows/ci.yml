name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Test on Python ${{ matrix.python-version }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest

      - name: Run test suite (195 tests)
        run: |
          pytest -v

      - name: Verify CLI commands
        run: |
          python -m vmsim_v2.vmsim run --frames 3 --steps LRU
          python -m vmsim_v2.vmsim workloads --frames 4
          python -m vmsim_v2.vmsim belady

      - name: Verify cross-engine & v1 parity
        run: |
          python vmsim_v2/tools/check_against_v1.py vmsim_v1/page_replacement_simulator.py --runs 5
          python vmsim_v2/tools/check_js_parity.py --runs 5
